# =============================================================================
# Yazi Keymap
# ~/.config/yazi/keymap.toml
# =============================================================================

[manager]

keymap = [
    { on = "<Esc>", run = "escape",             desc = "Exit visual mode, clear selection, or cancel search" },
    { on = "q",     run = "quit",               desc = "Quit" },
    { on = "Q",     run = "quit --no-cwd-file", desc = "Quit without writing cwd" },
    { on = "<C-c>", run = "close",              desc = "Close tab or quit" },

    # Navigation
    { on = "k",      run = "arrow -1",    desc = "Move up" },
    { on = "j",      run = "arrow 1",     desc = "Move down" },
    { on = "K",      run = "arrow -5",    desc = "Move up 5" },
    { on = "J",      run = "arrow 5",     desc = "Move down 5" },
    { on = "h",      run = "leave",       desc = "Go to parent" },
    { on = "l",      run = "enter",       desc = "Enter directory" },
    { on = "H",      run = "back",        desc = "Go back in history" },
    { on = "L",      run = "forward",     desc = "Go forward in history" },
    { on = "<Up>",   run = "arrow -1",    desc = "Move up" },
    { on = "<Down>", run = "arrow 1",     desc = "Move down" },
    { on = "<Left>", run = "leave",       desc = "Go to parent" },
    { on = "<Right>",run = "enter",       desc = "Enter directory" },
    { on = "g g",    run = "arrow -99999999", desc = "Go to top" },
    { on = "G",      run = "arrow 99999999",  desc = "Go to bottom" },

    # Selection
    { on = "<Space>", run = ["select --state=none", "arrow 1"], desc = "Toggle selection" },
    { on = "v",       run = "visual_mode",  desc = "Enter visual mode" },
    { on = "V",       run = "visual_mode --unset", desc = "Enter unset visual mode" },

    # Operations
    { on = "o",      run = "open",                desc = "Open file" },
    { on = "O",      run = "open --interactive",  desc = "Open interactively" },
    { on = "<Enter>",run = "open",                desc = "Open file" },
    { on = "y",      run = "yank",                desc = "Yank (copy)" },
    { on = "x",      run = "yank --cut",          desc = "Yank (cut)" },
    { on = "p",      run = "paste",               desc = "Paste" },
    { on = "P",      run = "paste --force",       desc = "Paste (overwrite)" },
    { on = "d",      run = "remove",              desc = "Trash" },
    { on = "D",      run = "remove --permanently",desc = "Delete permanently" },
    { on = "a",      run = "create",              desc = "Create file/dir" },
    { on = "r",      run = "rename --cursor=before_ext", desc = "Rename" },
    { on = "c",      run = "copy path",           desc = "Copy path" },

    # Search & filter
    { on = "/", run = "find --smart",  desc = "Find next" },
    { on = "?", run = "find --previous --smart", desc = "Find previous" },
    { on = "n", run = "find_arrow",    desc = "Next find" },
    { on = "N", run = "find_arrow --previous", desc = "Previous find" },
    { on = "f", run = "filter --smart",desc = "Filter" },
    { on = "s", run = "search fd",     desc = "Search with fd" },
    { on = "S", run = "search rg",     desc = "Search contents with rg" },

    # Goto shortcuts
    { on = "g h", run = "cd ~",                    desc = "Go home" },
    { on = "g c", run = "cd ~/.config",            desc = "Go to .config" },
    { on = "g d", run = "cd ~/Downloads",          desc = "Go to Downloads" },
    { on = "g D", run = "cd ~/Documents",          desc = "Go to Documents" },
    { on = "g p", run = "cd ~/Pictures",           desc = "Go to Pictures" },
    { on = "g r", run = "cd /",                    desc = "Go to root" },

    # Sorting
    { on = ", n", run = "sort natural  --reverse=no", desc = "Sort by name" },
    { on = ", N", run = "sort natural  --reverse",    desc = "Sort by name (rev)" },
    { on = ", m", run = "sort modified --reverse=no", desc = "Sort by modified" },
    { on = ", M", run = "sort modified --reverse",    desc = "Sort by modified (rev)" },
    { on = ", s", run = "sort size     --reverse=no", desc = "Sort by size" },
    { on = ", S", run = "sort size     --reverse",    desc = "Sort by size (rev)" },

    # Tabs
    { on = "t",       run = "tab_create --current", desc = "New tab" },
    { on = "<Tab>",   run = "tab_switch 1 --relative", desc = "Next tab" },
    { on = "<S-Tab>", run = "tab_switch -1 --relative", desc = "Prev tab" },

    # Misc
    { on = ".",  run = "hidden toggle",  desc = "Toggle hidden files" },
    { on = "R",  run = "refresh",        desc = "Refresh" },
    { on = "~",  run = "help",           desc = "Help" },
]

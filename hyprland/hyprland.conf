# =============================================================================
# Hyprland Configuration
# Theme: Kanagawa | Resolution: 2560x1440 | Keyboard: US QWERTY
# =============================================================================
# --- Monitor -----------------------------------------------------------------
monitor=,2560x1440@144,0x0,1
# --- Auto-start --------------------------------------------------------------
exec-once = hyprpaper
exec-once = waybar
exec-once = hypridle
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# --- Environment Variables ---------------------------------------------------
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
# --- Input -------------------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true
    }
}
# --- General -----------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border   = rgba(7E9CD8ff) rgba(957FB8ff) 45deg
    col.inactive_border = rgba(2A2A37ff)
    layout = dwindle
    allow_tearing = false
}
# --- Decoration --------------------------------------------------------------
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }
    # FIX: shadow options moved into shadow {} sub-block (Hyprland >= 0.41)
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(0D0C0Ccc)
    }
}
# --- Animations --------------------------------------------------------------
animations {
    enabled = true
    bezier = easeOut,     0.16, 1,    0.3,  1
    bezier = easeInOut,   0.87, 0,    0.13, 1
    bezier = overshot,    0.05, 0.9,  0.1,  1.05
    bezier = smoothIn,    0.25, 1,    0.5,  1
    animation = windows,     1, 4,  overshot, slide
    animation = windowsOut,  1, 3,  easeOut,  popin 80%
    animation = border,      1, 6,  easeInOut
    animation = borderangle, 1, 8,  easeInOut, loop
    animation = fade,        1, 4,  smoothIn
    animation = workspaces,  1, 4,  easeInOut, slidevert
}
# --- Layouts -----------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}
master {
    # FIX: new_is_master replaced by new_status (Hyprland >= 0.41)
    new_status = master
}
# --- Gestures ----------------------------------------------------------------
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.2
}
# --- Misc --------------------------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
# =============================================================================
# Keybindings
# =============================================================================
$mod = SUPER
$terminal = alacritty
$filemanager = thunar
$launcher = hyprlauncher
$browser = firefox
# --- Core --------------------------------------------------------------------
bind = $mod, Return,      exec, $terminal
bind = $mod, E,           exec, $filemanager
bind = $mod, Space,       exec, $launcher
bind = $mod, B,           exec, $browser
bind = $mod SHIFT, Q,     killactive
bind = $mod SHIFT, E,     exit
bind = $mod, F,           fullscreen
bind = $mod SHIFT, F,     togglefloating
bind = $mod, P,           pseudo
# FIX: $mod J conflict resolved — togglesplit moved to $mod T
bind = $mod, T,           togglesplit
# --- Lock & Power ------------------------------------------------------------
# FIX: $mod L conflict resolved — lock moved to $mod SHIFT, L
bind = $mod SHIFT, L,     exec, hyprlock
bind = $mod SHIFT, P,     exec, systemctl poweroff
bind = $mod SHIFT, R,     exec, systemctl reboot
# --- Screenshots -------------------------------------------------------------
bind = ,      Print,      exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print,      exec, grim - | swappy -f -
bind = $mod,  Print,      exec, grim -g "$(slurp)" - | wl-copy
# --- Clipboard ---------------------------------------------------------------
bind = $mod, V,           exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
# --- Volume ------------------------------------------------------------------
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# --- Brightness --------------------------------------------------------------
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# --- Media -------------------------------------------------------------------
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
# --- Focus -------------------------------------------------------------------
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
# FIX: was $mod L — now freed from lock conflict above
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u
# FIX: was $mod J — now freed from togglesplit conflict above
bind = $mod, J,     movefocus, d
# --- Move windows ------------------------------------------------------------
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, H,     movewindow, l
bind = $mod SHIFT, L,     movewindow, r
bind = $mod SHIFT, K,     movewindow, u
bind = $mod SHIFT, J,     movewindow, d
# --- Resize ------------------------------------------------------------------
binde = $mod CTRL, H,     resizeactive, -40 0
binde = $mod CTRL, L,     resizeactive,  40 0
binde = $mod CTRL, K,     resizeactive, 0 -40
binde = $mod CTRL, J,     resizeactive, 0  40
# --- Workspaces --------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
# --- Mouse -------------------------------------------------------------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# =============================================================================
# Window Rules
# =============================================================================
windowrulev2 = suppressevent maximize, class:.*
# Float specific apps
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation*)$
windowrulev2 = float, title:^(Picture-in-Picture)$
# Thunar size
windowrulev2 = size 900 600, class:^(thunar)$
windowrulev2 = center,       class:^(thunar)$
# pavucontrol size
windowrulev2 = size 700 500, class:^(pavucontrol)$
windowrulev2 = center,       class:^(pavucontrol)$
# Opacity
windowrulev2 = opacity 0.95 0.90, class:^(Alacritty)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
